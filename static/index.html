      setButtonDisabled(micBtn, false);
      recorder.start();
    } catch (err) {
      // #region agent log
      __qvLog("H2", "static/index.html:startRecording", "getUserMedia failed", {
        error: String(err || ""),
      });
      // #endregion agent log
      const name = err && typeof err === "object" ? String(err.name || "") : "";
      let msg = "Microphone permission not granted.";
      if (name === "NotAllowedError" || name === "PermissionDeniedError") {
        msg = "Microphone permission not granted.";
      } else if (name === "NotFoundError") {
        msg = "No microphone found on this device.";
      } else if (name === "NotReadableError") {
        msg = "Microphone is currently in use by another app.";
      }
      setHelper(host, "Just respond with your voice and we'll turn it into text.");
      showBanner(host, msg, false);
    } finally {
      setButtonDisabled(micBtn, false);
    }
  };

  const styleMicButton = (micBtn, replyBtn, project) => {
    if (!micBtn || !replyBtn) return;
    const replyStyle = getComputedStyle(replyBtn);
    const rect = replyBtn.getBoundingClientRect();
    const baseSize = rect.height || 44;
    const size = Math.max(36, baseSize);
    const fallback = textValue(project?.colour) || "#684EAD";
    const replyBg = replyStyle.backgroundColor;
    const accent = replyBg && replyBg !== "rgba(0, 0, 0, 0)" && replyBg !== "transparent" ? replyBg : fallback;
    const bg = replyStyle.backgroundColor || "transparent";
    const borderColor =
      replyStyle.borderColor && replyStyle.borderColor !== "rgba(0, 0, 0, 0)" ? replyStyle.borderColor : accent;

    micBtn.style.height = `${size}px`;
    micBtn.style.width = `${size}px`;
    micBtn.style.borderRadius = "9999px";
    micBtn.style.marginRight = "8px";
    micBtn.style.borderWidth = replyStyle.borderWidth || "1.5px";
    micBtn.style.borderStyle = replyStyle.borderStyle || "solid";
    micBtn.style.borderColor = borderColor;
    micBtn.style.boxShadow = replyStyle.boxShadow || "none";
    micBtn.style.backgroundColor = "#fff";
    micBtn.style.color = accent || replyStyle.color || "#684EAD";
  };

  // #region agent log
  const logMicLayout = (micBtn, micHost, replyBtn) => {
    try {
      const rect = micBtn.getBoundingClientRect();
      const micStyle = getComputedStyle(micBtn);
      const hostStyle = micHost ? getComputedStyle(micHost) : null;
      __qvLog("H2", "static/index.html:micLayout", "Mic layout", {
        micRect: {
          left: Math.round(rect.left),
          top: Math.round(rect.top),
          width: Math.round(rect.width),
          height: Math.round(rect.height),
        },
        micPointer: micStyle.pointerEvents,
        micZ: micStyle.zIndex,
        hostPointer: hostStyle ? hostStyle.pointerEvents : null,
        hostZ: hostStyle ? hostStyle.zIndex : null,
        replyTag: replyBtn ? replyBtn.tagName : null,
      });
    } catch {
      // ignore
    }
  };
  // #endregion agent log

  const ensureActionRowLayout = (parent) => {
    if (!parent || !(parent instanceof HTMLElement)) return;
    const style = getComputedStyle(parent);
    if (!["flex", "inline-flex"].includes(style.display)) {
      parent.style.display = "inline-flex";
      parent.style.alignItems = "center";
      parent.style.gap = "8px";
    }
    parent.style.overflow = "visible";
  };

  const attach = () => {
    if (!isVoiceEnabled()) return;
    ensureStyles();

    const project = getProject() || {};
    const desiredPlaceholder = textValue(project.answer_placeholder);
    const inputEl =
      (desiredPlaceholder &&
        document.querySelector(`textarea[placeholder=${JSON.stringify(desiredPlaceholder)}],input[placeholder=${JSON.stringify(desiredPlaceholder)}]`)) ||
      document.querySelector("textarea") ||
      document.querySelector("input[type='text']") ||
      null;
    if (!inputEl) return;

    const replyLabel = textValue(project.cta_reply) || "Send";
    const replyNorm = normalize(replyLabel);

    const findReplyNear = () => {
      let node = inputEl.parentElement;
      for (let depth = 0; node && node !== document.body && depth < 12; depth += 1, node = node.parentElement) {
        const leaf = Array.from(node.querySelectorAll("div,span,p,button,a")).find((el) => {
          if (!(el instanceof HTMLElement)) return false;
          if (el.childElementCount !== 0) return false;
          return normalize(el.textContent) === replyNorm;
        });
        if (leaf) return findClickableParent(leaf);
      }
      const globalLeaf = Array.from(document.querySelectorAll("div,span,p,button,a")).find((el) => {
        if (!(el instanceof HTMLElement)) return false;
        if (el.childElementCount !== 0) return false;
        return normalize(el.textContent) === replyNorm;
      });
      return globalLeaf ? findClickableParent(globalLeaf) : null;
    };

    const replyBtnRaw = findReplyNear();
    if (!replyBtnRaw) return;
    const replyBtnRoot =
      (replyBtnRaw instanceof HTMLElement &&
        (replyBtnRaw.closest("button") ||
          replyBtnRaw.closest("[role='button']") ||
          replyBtnRaw.closest("[tabindex]"))) ||
      replyBtnRaw;
    const replyBtn = replyBtnRoot;
    // #region agent log
    if (!window.__qvAttachLogTs || Date.now() - window.__qvAttachLogTs > 1000) {
      window.__qvAttachLogTs = Date.now();
      __qvLog("H1", "static/index.html:attach", "Attach found input/reply", {
        inputTag: inputEl ? inputEl.tagName : null,
        replyText: (replyBtn.textContent || "").slice(0, 50),
        replyDisabled: Boolean(replyBtn.disabled),
        replyTag: replyBtn.tagName,
        replyRole: replyBtn.getAttribute ? replyBtn.getAttribute("role") : null,
        replyParentTag: replyBtn.parentElement ? replyBtn.parentElement.tagName : null,
      });
    }
    // #endregion agent log

    const existingMic = document.getElementById(VOICE.ids.micButton);
    if (existingMic && document.body.contains(existingMic)) {
      const isProcessing = existingMic.dataset.processing === "1";
      if (!isProcessing) {
        // Ensure mic stays enabled even if the UI disables other buttons.
        // @ts-ignore
        existingMic.disabled = false;
        existingMic.removeAttribute("disabled");
        existingMic.setAttribute("aria-disabled", "false");
      }
      // Keep mic next to reply if React moved the button.
      if (replyBtn.parentElement && existingMic.previousElementSibling !== replyBtn) {
        try {
          replyBtn.parentElement.insertBefore(existingMic, replyBtn);
        } catch {
          // Ignore
        }
      }
      if (replyBtn.parentElement) {
        ensureActionRowLayout(replyBtn.parentElement);
      }
      styleMicButton(existingMic, replyBtn, project);
      return;
    }

    const micBtn = document.createElement("button");
    micBtn.type = "button";
    micBtn.id = VOICE.ids.micButton;
    micBtn.setAttribute("aria-label", "Record voice");
    micBtn.dataset.processing = "0";
    micBtn.appendChild(createIcon());

    let parent = replyBtn.parentElement || null;
    if (parent && parent.tagName && parent.tagName.toLowerCase() === "button") {
      parent = parent.parentElement;
    }
    if (parent && parent.getAttribute && parent.getAttribute("role") === "button") {
      parent = parent.parentElement;
    }
    if (!parent) return;

    ensureActionRowLayout(parent);
    let micHost = document.getElementById(VOICE.ids.wrap);
    if (!micHost) {
      micHost = document.createElement("div");
      micHost.id = VOICE.ids.wrap;
      micHost.style.display = "inline-flex";
      micHost.style.alignItems = "center";
      micHost.style.marginRight = "16px";
    }
    micHost.appendChild(micBtn);
    try {
      parent.insertBefore(micHost, replyBtn);
    } catch {
      return;
    }
    if (replyBtn.contains(micBtn) || replyBtn.contains(micHost)) {
      try {
        const outer = parent.parentElement || parent;
        outer.insertBefore(micHost, parent);
      } catch {
        // ignore
      }
    }
    styleMicButton(micBtn, replyBtn, project);
    // #region agent log
    logMicLayout(micBtn, micHost, replyBtn);
    // #endregion agent log
    // #region agent log
    __qvLog("H1", "static/index.html:attachInserted", "Mic inserted", {
      parentTag: parent ? parent.tagName : null,
      micPresent: Boolean(document.getElementById(VOICE.ids.micButton)),
    });
    // #endregion agent log

    const host = createVoiceHost(inputEl);

    const stopBtn = host.querySelector(`#${VOICE.ids.stop}`);
    const cancelBtn = host.querySelector(`#${VOICE.ids.cancel}`);
    const undoBtn = host.querySelector(`#${VOICE.ids.undo}`);
    const copyBtn = host.querySelector(`#${VOICE.ids.copy}`);
    const clearBtn = host.querySelector(`#${VOICE.ids.clear}`);
    const retryBtn = host.querySelector(`#${VOICE.ids.bannerRetry}`);
    const fileInput = host.querySelector(`#${VOICE.ids.fileInput}`);

    if (!micBtn.dataset.listenerAttached) {
      micBtn.dataset.listenerAttached = "1";
      micBtn.addEventListener("pointerdown", () => {
        // #region agent log
        __qvLog("H2", "static/index.html:micPointerDown", "Mic pointer down", {});
        // #endregion agent log
      });
    }

    micBtn.addEventListener("click", () => {
      // #region agent log
      __qvLog("H2", "static/index.html:micClick", "Mic clicked", {
        replyTag: replyBtn.tagName,
        parentTag: parent ? parent.tagName : null,
        micHostTag: micHost ? micHost.tagName : null,
      });
      // #endregion agent log
      startRecording({ host, micBtn, replyBtn, inputEl });
    });

    if (stopBtn) {
      stopBtn.addEventListener("click", () => {
        if (state.recorder && state.recorder.state !== "inactive") {
          setHelper(host, "Turning your voice into text...");
          setRecordingVisible(host, false);
          setButtonDisabled(stopBtn, true);
          try {
            state.recorder.stop();
          } catch {
            cleanupRecording();
          } finally {
            setButtonDisabled(stopBtn, false);
          }
        }
      });
    }

    if (cancelBtn) {
      cancelBtn.addEventListener("click", () => {
        state.cancelled = true;
        try {
          if (state.recorder && state.recorder.state !== "inactive") state.recorder.stop();
        } catch {
          cleanupRecording();
        }
        setRecordingVisible(host, false);
        setHelper(host, "Just respond with your voice and we'll turn it into text.");
      });
    }

    const doUndo = () => {
      const cur = String(inputEl.value || "");
      const maybeRemoved = removeInsertedSegment(cur);
      if (maybeRemoved !== null) {
        setInputValue(inputEl, maybeRemoved);
      } else {
        setInputValue(inputEl, state.beforeInsertValue || "");
      }
      setActionsVisible(host, false);
      setHelper(host, "Just respond with your voice and we'll turn it into text.");
    };

    if (undoBtn) undoBtn.addEventListener("click", doUndo);
    if (clearBtn) clearBtn.addEventListener("click", doUndo);

    if (copyBtn) {
      copyBtn.addEventListener("click", async () => {
        const ok = await copyToClipboard(state.transcript);
        if (!ok) return;
        const prev = copyBtn.textContent;
        copyBtn.textContent = "Copied";
        setTimeout(() => {
          copyBtn.textContent = prev;
        }, 900);
      });
    }

    if (retryBtn) {
      retryBtn.addEventListener("click", () => {
        hideBanner(host);
        startRecording({ host, micBtn, replyBtn, inputEl });
      });
    }

    if (fileInput) {
      fileInput.addEventListener("change", async () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;
        await uploadAndInsert({ host, micBtn, replyBtn, inputEl, file });
        fileInput.value = "";
      });
    }
  };

  const voiceObserverHandler = makeRafThrottled(() => {
    // Re-attach if React re-renders.
    try {
      attach();
    } catch {
      // Ignore
    }
    // #region agent log
    __qvLog("H1", "static/index.html:voiceObserver", "MutationObserver tick", {
      throttled: true,
    });
    // #endregion agent log
  }, "voice");

  const observer = new MutationObserver(voiceObserverHandler);

  observer.observe(document.body, { childList: true, subtree: true });
  attach();
})();
</script>
</body>
